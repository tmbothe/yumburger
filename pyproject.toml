[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yumburger"
version = "0.1.0"
description = "YumBurger Federated Semantic Connector POC"
requires-python = ">=3.11"
authors = [{ name = "YumBurger DataEng", email = "mbothe7@gmail.com" }]

dependencies = [
    # AWS
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.3.0",

    # Data
    "pyarrow>=14.0.0",
    "pandas>=2.1.0",
    "faker>=22.0.0",

    # API & web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",

    # Config & validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # Ontology
    "rdflib>=7.0.0",

    # SQL parsing (for verifier)
    "sqlglot>=23.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "moto[s3,athena,dynamodb,iam,sts]>=5.0.0",
]

[project.scripts]
yumburger-datagen = "datagen.cli:app"
yumburger-serve = "connector.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "live: marks tests that require deployed AWS infrastructure (deselect with '-m not live')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datagen*", "infra*", "lakehouse*", "ontology*", "connector*", "bodhi_sim*"]
